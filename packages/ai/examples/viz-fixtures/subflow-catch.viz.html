  .node-body-StartNode, .node-body-EndNode { stroke: #94a3b8; }

  .col-divider { stroke: #e4e4e7; stroke-width: 1; stroke-dasharray: 2 3; }

  /* Container metadata (Map/ParallelMap/Catch/Flow/ParallelFlow strip) */
  .container-meta {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #9a3412;
    font-style: italic;

    fill: #fafafa;
    stroke: #d4d4d8;
    stroke-width: 1;
    stroke-dasharray: 3 3;

  .subflow-caption {
    fill: #fff7ed;
    stroke: #fed7aa;

    font-size: 11px;

    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #9a3412;
  }
  .subflow-citation {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #b45309;
    font-style: italic;
  }

    fill: #f5f3ff;
    stroke: #c4b5fd;
    stroke-width: 1;
  }
  .tools-header {
    fill: #6d28d9;
  }
  .tool-sig {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #1e1b4b;
  }
  /* MCPToolBox row — slightly distinct so it doesn't look like a fake
     ServerTool with an empty signature. */
  .tool-box-sig {
    font-style: italic;
    fill: #4338ca;
  }
  .tool-desc {
    font-size: 10px;
    fill: #6b7280;
    font-style: italic;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  .node-name {
    font-size: 13px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    fill: #18181b;
  }
  .node-sub {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #71717a;
  }
  .section-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    fill: #a1a1aa;
    font-weight: 600;
  }

  .field-name {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #27272a;
  }
  .field-type {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #71717a;
  }

  .port-in  { fill: #f8fafc; stroke: #94a3b8; }
  .port-out { fill: #64748b; stroke: #475569; }

  .edge-control { stroke: #18181b; stroke-width: 1.5; }
  .edge-data { stroke: #a1a1aa; stroke-width: 1.2; stroke-dasharray: 3 3; }
  .edge-label {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .branch-label { fill: #b45309; font-weight: 600; }
  .data-label { fill: #71717a; }
