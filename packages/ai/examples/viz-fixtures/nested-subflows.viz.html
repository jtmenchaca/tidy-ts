    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #9a3412;
    font-style: italic;

    fill: #9a3412;

  .subflow-citation {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #b45309;
    font-style: italic;
  }

    fill: #f5f3ff;
    stroke: #c4b5fd;
    stroke-width: 1;
  }
  .tools-header {
    fill: #6d28d9;
  }
  .tool-sig {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #1e1b4b;

    font-style: italic;
    fill: #4338ca;
  }
  .tool-desc {
    font-size: 10px;
    fill: #6b7280;
    font-style: italic;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

    font-size: 13px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  .node-sub {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #71717a;
  }
  .section-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    fill: #a1a1aa;
    font-weight: 600;
  }

    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: #27272a;
  }
  .field-type {
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

  .edge-data { stroke: #a1a1aa; stroke-width: 1.2; stroke-dasharray: 3 3; }
