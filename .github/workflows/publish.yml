name: Publish to JSR

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - dataframe
          - arrow
          - parquet
          - shims

permissions:
  contents: read
  id-token: write # Required for JSR provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install
        working-directory: packages/dataframe

      - name: Publish dataframe
        if: inputs.package == 'dataframe'
        run: deno publish
        working-directory: packages/dataframe

      - name: Publish shims
        if: inputs.package == 'shims'
        run: deno publish
        working-directory: packages/shims

      - name: Publish arrow
        if: inputs.package == 'arrow'
        run: deno publish
        working-directory: packages/arrow

      - name: Publish parquet
        if: inputs.package == 'parquet'
        run: deno publish
        working-directory: packages/parquet
