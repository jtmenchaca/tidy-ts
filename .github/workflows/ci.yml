name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tidy-ts-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create output directories
        run: mkdir -p packages/examples/dataframe/output packages/testing/bugs/output

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: pnpm install

      - name: Run CI tests
        run: |
          deno fmt && deno lint && \
          deno test -A --v8-flags=--max-old-space-size=8192 packages/dataframe --quiet && \
          deno test -A --v8-flags=--max-old-space-size=8192 packages/examples/dataframe --quiet && \
          deno test -A --v8-flags=--max-old-space-size=8192 packages/testing/bugs --quiet && \
          deno test -A --v8-flags=--max-old-space-size=8192 packages/testing/statistical_tests --quiet
